<!doctype html>
<meta charset="utf-8">
<style>
  body{margin:0;background:#fff}
  button{position:absolute;top:100px;width:200px;height:60px}
  #target{left:100px}
  #soon{left:500px}
  .veil{position:fixed;top:80px;width:260px;height:100px;background:rgba(0,0,0,.2)}
</style>
<button id="target" onclick="this.textContent='Clicked'">Target</button>
<button id="soon" onclick="this.textContent='Clicked'">Soon</button>
<button id="close" style="top:300px;left:100px" onclick="this.textContent='Closed'"><span class="icon" style="pointer-events:none">Close</span></button>
<label style="position:absolute;top:300px;left:500px;width:200px;height:40px;background:#eee">
  <input type="checkbox" id="agree" style="position:absolute;left:0;top:0;margin:0;opacity:0;z-index:-1" onchange="out.textContent='Agreed'">Agree
</label>
<p id="out" style="position:absolute;top:400px;left:100px"></p>
<div class="veil" style="left:70px"></div>
<div class="veil" id="brief" style="left:470px"></div>
<script>addEventListener('load', () => setTimeout(() => brief.remove(), 2000));</script>
