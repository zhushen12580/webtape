<!doctype html>
<meta charset="utf-8">
<style>html,body{height:100%;margin:0;background:#fff}</style>
<input id="t" autofocus>
<script>
  const t = document.getElementById('t');
  t.addEventListener('input', () => {
    document.body.style.background = t.value === 'abcd' || t.value === '你好🙂' ? 'lime' : '#fff';
  });
  t.addEventListener('keydown', e => { if (e.key === 'Enter') document.body.style.background = 'blue'; });
</script>
